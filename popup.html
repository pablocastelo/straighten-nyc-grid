<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
      color: #222;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .row label {
      font-size: 13px;
    }
    input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }
    .angle-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
    }
    .angle-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #111;
    }
    button {
      width: 100%;
      padding: 7px 10px;
      margin-top: 6px;
      font-size: 12px;
      cursor: pointer;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    button:hover { background: #ececec; }
    .hint {
      font-size: 11px;
      color: #888;
      margin: 12px 0 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Straighten NYC Grid</h1>
  <div class="row">
    <input type="checkbox" id="enabled">
    <label for="enabled">Rotate map</label>
  </div>
  <div class="angle-label">
    <span>Rotation</span>
    <span id="angle-display" class="angle-display">-28.9°</span>
  </div>
  <input type="range" id="angle" min="-90" max="90" step="0.1" value="-28.9">
  <button id="reset">Reset to Manhattan (-28.9°)</button>
  <p class="hint">
    Manhattan's avenues run ~28.9° east of true north. Rotate by -28.9° to make them vertical.
    Open Google Maps and toggle this on.
  </p>
  <script src="popup.js"></script>
</body>
</html>
